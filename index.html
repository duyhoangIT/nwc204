time applications, such as streaming audio and video, which field in the IPv6 header can be used to inform the routers and switches to maintain the same path for the packets in the same conversation?","vi":"Trường nào trong header IPv6 giúp xác định các gói thuộc cùng luồng, phục vụ lưu lượng thời gian thực?","opts":{"A":"Next Header","B":"Flow Label","C":"Traffic Class","D":"Differentiated Services"},"ans":"B","why":"IPv6 Flow Label giúp định danh các gói cùng flow để thiết bị mạng có thể xử lý nhất quán, hữu ích cho lưu lượng thời gian thực.","cat":1,"ready":true,"certified":false},{"id":184,"number":183,"en":"When 2 or more bits in a data unit has been changed during the transmission, the error is called:","vi":"Nếu hai bit trở lên trong một đơn vị dữ liệu bị thay đổi khi truyền, lỗi đó gọi là gì?","opts":{"A":"random error","B":"burst error","C":"inverted error","D":"double error"},"ans":"B","why":"Burst error là khi một nhóm hai hoặc nhiều bit trong đơn vị dữ liệu bị thay đổi trong một khoảng truyền; không phải single-bit error.","cat":5,"ready":true,"certified":false},{"id":185,"number":184,"en":"Why is UDP desirable for protocols that make a simple request and reply transactions?","vi":"Vì sao UDP phù hợp với giao thức chỉ yêu cầu–đáp ứng đơn giản?","opts":{"A":"Flow control","B":"Low overhead","C":"Reliability","D":"Same-order delivery"},"ans":"B","why":"UDP không cần thiết lập phiên/bắt tay và có header nhỏ (8 byte), nên giảm độ trễ/overhead cho yêu cầu–đáp ứng đơn giản.","cat":5,"ready":true,"certified":false},{"id":186,"number":185,"en":"How can you view the ARP table on a Windows PC?","vi":"Làm thế nào để xem bảng ARP trên máy Windows?","opts":{"A":"arp -a","B":"show arp","C":"netstat -r","D":"ipconfig /all ee"},"ans":"A","why":"Lệnh `arp -a` trong Windows hiển thị các ánh xạ IP–MAC đang có trong ARP cache.","cat":4,"ready":true,"certified":false},{"id":187,"number":186,"en":"How many bits must be borrowed from the host portion of an address to accommodate a router with five connected networks?","vi":"Cần mượn bao nhiêu bit của phần host để chia mạng đủ cho năm mạng kết nối vào router?","opts":{"A":"two","B":"three","C":"four","D":"five ee"},"ans":"B","why":"Cần ít nhất 5 subnet nên mượn n bit thỏa 2^n≥5, tức n=3 bit. Ba bit tạo 8 subnet khả dụng theo cách chia mạng hiện đại.","cat":0,"ready":true,"certified":false},{"id":188,"number":187,"en":"How is the privileged EXEC mode access secured on a switch?","vi":"Cách bảo mật quyền truy cập chế độ privileged EXEC trên switch là gì?","opts":{"A":"enable class","B":"secret class","C":"enable secret cisco@12345","D":"service password-encryption"},"ans":"C","why":"Dùng `enable secret <mật_khẩu>` trong global config; khi từ User EXEC sang Privileged EXEC, IOS yêu cầu mật khẩu này.","cat":4,"ready":true,"certified":false},{"id":189,"number":188,"en":"How can an administrator verify the current IP configuration of all router interfaces?","vi":"Quản trị viên dùng cách nào để kiểm tra cấu hình IP hiện tại của tất cả cổng router?","opts":{"A":"show ip interface brief","B":"display interfaces","C":"check interfaces","D":"list interfaces errr e reer ee"},"ans":"A","why":"`show ip interface brief` hiển thị nhanh toàn bộ interface router, địa chỉ IPv4 và trạng thái up/down.","cat":4,"ready":true,"certified":false},{"id":190,"number":189,"en":"A client packet is received by a server. The packet has a destination port number of 22. What service is the client requesting?","vi":"Gói gửi đến máy chủ có destination port 22: máy khách đang yêu cầu dịch vụ nào?","opts":{"A":"SSH","B":"DHCP Cc. DNS","D":"TFTP"},"ans":"A","why":"TCP destination port 22 là cổng mặc định của SSH, dùng điều khiển thiết bị từ xa có mã hóa.","cat":4,"ready":true,"certified":false},{"id":191,"number":190,"en":"A message is sent to all hosts on a remote network. Which type of message is it?","vi":"Một thông điệp được gửi đến tất cả host trên một mạng ở xa. Đây là kiểu thông điệp nào?","opts":{"A":"limited broadcast","B":"multicast","C":"directed broadcast","D":"unicast"},"ans":"C","why":"Directed broadcast là gói hướng tới địa chỉ broadcast của một mạng từ xa; limited broadcast 255.255.255.255 chỉ có phạm vi LAN cục bộ. Vì thế chọn C.","cat":1,"ready":true,"certified":false},{"id":192,"number":191,"en":"I A networking technician is working on the wireless network at a medical clinic. The technician accidentally sets up the wireless network so that patients can see the medical records data of other patients. Which of the four network characteristics has been violated in this situation?","vi":"Kỹ thuật viên cấu hình Wi-Fi tại phòng khám làm lộ hồ sơ bệnh án của bệnh nhân khác. Đặc tính mạng tin cậy nào bị vi phạm?","opts":{"A":"fault tolerance","B":"scalability","C":"security","D":"Quality of Service (QoS)","E":"reliability"},"ans":"C","why":"Security bị vi phạm vì thông tin hồ sơ bệnh án bị truy cập trái phép; đây không phải lỗi scalability, QoS hay fault tolerance.","cat":5,"ready":true,"certified":false},{"id":193,"number":192,"en":"A technician needs to configure a point-to-point WAN link and a subnet for a department with 50 hosts. Which subnet mask combinations are appropriate and efficient for these two use cases?","vi":"Đường WAN điểm–điểm và mạng phòng ban có 50 host cần các subnet mask nào để tiết kiệm địa chỉ?","opts":{"A":"/30 for WAN, /26 for department","B":"/24 for both","C":"/27 for WAN, /25 for department","D":"/26 for both"},"ans":"A","why":"WAN point-to-point cần 2 host và dùng /30 (2 IP usable) theo cách chia phổ biến; mạng 50 host dùng /26 (62 IP usable).","cat":5,"ready":true,"certified":false},{"id":194,"number":193,"en":"A host sends an IPv6 Neighbor Solicitation (NS) to determine a MAC address. What type of address is used for this request?","vi":"Host gửi IPv6 Neighbor Solicitation để tìm MAC sẽ gửi thông điệp đến loại địa chỉ nào?","opts":{"A":"Solicited-node multicast address","B":"All-nodes multicast address","C":"Global unicast address","D":"IPv4-mapped IPv6 address"},"ans":"A","why":"NS thường gửi đến solicited-node multicast IPv6 tương ứng địa chỉ đích, ánh xạ sang MAC multicast; tránh broadcast toàn mạng.","cat":5,"ready":true,"certified":false},{"id":195,"number":194,"en":"Which method of memory buffering would work best for this task?","vi":"Switch Layer 2 chuyển frame từ cổng 1000BASE-T sang cổng 100BASE-T; phương pháp đệm nào thích hợp nhất?","opts":{"A":"port-based buffering","B":"level 1 cache buffering","C":"shared memory buffering","D":"fixed configuration buffering ee"},"ans":"C","why":"Shared memory buffering cho phép frame đi từ cổng tốc độ cao sang cổng chậm trong bộ nhớ chung, thích hợp khi tốc độ cổng không tương xứng.","cat":2,"ready":true,"certified":false},{"id":196,"number":195,"en":"what is the correct order of the protocol stack that is used to decode the received transmission?","vi":"Máy khách web đang nhận phản hồi từ máy chủ. Thứ tự các lớp giao thức khi giải đóng gói dữ liệu là gì?","opts":{"A":"Ethernet, IP. TCP, HTTP","B":"HTTP, TCP. IP, Ethernet","C":"Ethernet, TCP, IP. HTTP","D":"HTTP, Ethernet, IP, TCP"},"ans":"A","why":"Khi nhận gói web, client tháo đóng gói theo thứ tự Ethernet → IP → TCP → HTTP (từ tầng liên kết tới tầng ứng dụng).","cat":5,"ready":true,"certified":false},{"id":197,"number":196,"en":"A network administrator is testing network connectivity by issuing the ping command on a router. Which symbol will be displayed to indicate that a time expired during the wait for an ICMP echo reply message? A$","vi":"Khi ping trên router, ký tự nào biểu thị thời gian chờ ICMP Echo Reply đã hết?","opts":{"B":"!","C":".","D":"U eee"},"ans":"C","why":"Trong Cisco IOS ping, dấu `.` cho biết timeout, `!` cho biết nhận Echo Reply thành công và `U` cho biết đích unreachable.","cat":4,"ready":true,"certified":false},{"id":198,"number":197,"en":"A web client receives a response from a web server. What is the correct order of the protocol stack used to decode the transmission?","vi":"Máy khách web giải đóng gói phản hồi từ server theo thứ tự các lớp giao thức nào?","opts":{"A":"Ethernet, IP, TCP, HTTP","B":"HTTP, TCP, IP, Ethernet","C":"TCP, IP, Ethernet, HTTP","D":"HTTP, Ethernet, IP, TCP"},"ans":"A","why":"Tháo đóng gói dữ liệu từ dưới lên: Ethernet (Data Link) → IP (Network) → TCP (Transport) → HTTP (Application).","cat":5,"ready":true,"certified":false},{"id":199,"number":198,"en":"A technician is configuring a router to allow for all forms of management access. As part of each different type of access, the technician is trying to type the command login. Which configuration mode should be entered to do this task?","vi":"Muốn nhập lệnh login để bảo vệ một loại kết nối quản trị router, cần vào chế độ cấu hình nào?","opts":{"A":"user executive mode","B":"global configuration mode","C":"any line configuration mode","D":"privileged EXEC mode"},"ans":"C","why":"Lệnh `login` được nhập trong line configuration (`line console 0` hoặc `line vty ...`) để kích hoạt xác thực trên đường truy cập.","cat":4,"ready":true,"certified":false},{"id":200,"number":199,"en":"| An employee at a branch office is creating a quote for a customer. In order to do this, the employee needs to access confidential pricing information from internal servers at ihe Head Office. What type of network would the employee access?","vi":"Nhân viên chi nhánh muốn truy cập thông tin giá mật từ server tại trụ sở. Loại mạng nào cần dùng?","opts":{"A":"an intranet","B":"the Internet","C":"an extranet O. a focal area network I I I I I I"},"ans":"A","why":"Nhân viên chi nhánh truy cập tài nguyên nội bộ của doanh nghiệp qua intranet, thường được bảo vệ bởi VPN nếu kết nối qua mạng công cộng.","cat":5,"ready":true,"certified":false},{"id":201,"number":200,"en":"An administrator measured the transfer of usable data across a 100 Mb/s physical channel over a given period of time and obtained 60 Mb/s. Which kind of measurement did the administrator obtain?","vi":"Đo đường truyền vật lý 100 Mb/s nhưng tốc độ dữ liệu hữu ích chỉ 60 Mb/s; đó là phép đo gì?","opts":{"A":"Throughput","B":"Digital bandwidth","C":"Geodput","D":"Latency ee"},"ans":"C","why":"Goodput là tốc độ dữ liệu ứng dụng hữu ích đo được, loại bỏ overhead/retransmission; throughput bao gồm khối lượng bit dữ liệu truyền qua mạng theo thời gian. Nếu đề chỉ nói 'usable data', chọn goodput.","cat":2,"ready":true,"certified":false},{"id":202,"number":201,"en":"Cut-through switching reduces latency but increases the risk of forwarding corrupted frames.","vi":"Chuyển mạch cut-through giảm độ trễ nhưng làm tăng nguy cơ chuyển tiếp khung bị lỗi: nhận định này đúng hay sai?","opts":{"A":"True","B":"False"},"ans":"A","why":"Cut-through bắt đầu chuyển frame trước khi nhận đủ phần chứa FCS, nên độ trễ thấp nhưng có thể chuyển tiếp frame hỏng. Store-and-forward mới kiểm tra CRC đầy đủ trước khi gửi.","cat":5,"ready":true,"certified":false},{"id":203,"number":202,"en":"which layer of the TCP/IP protocol?","vi":"TCP và UDP thuộc lớp nào trong mô hình TCP/IP?","opts":{"A":"Application","B":"Transport","C":"Internet","D":"Network access"},"ans":"B","why":"Trong TCP/IP, TCP và UDP thuộc lớp Transport, cung cấp giao tiếp giữa các ứng dụng bằng cổng nguồn/đích.","cat":0,"ready":true,"certified":false},{"id":204,"number":203,"en":"which layer of the TCP/IP protocol?","vi":"Trong bộ giao thức TCP/IP, UDP và TCP nằm ở tầng nào?","opts":{"A":"Application","B":"Transport","C":"Internet","D":"Network access"},"ans":"B","why":"Cả TCP và UDP đều là giao thức Transport; TCP tin cậy, có kết nối, còn UDP không kết nối và overhead thấp.","cat":0,"ready":true,"certified":false},{"id":205,"number":204,"en":"which TCP port group does the port 414 belong?","vi":"Cổng TCP số 414 thuộc nhóm cổng nào?","opts":{"A":"Registered","B":"well-known","C":"private or dynamic","D":"public"},"ans":"B","why":"Cổng 414 nằm trong 0–1023, là well-known port theo phân vùng số cổng; các cổng đăng ký bắt đầu từ 1024.","cat":0,"ready":true,"certified":false},{"id":206,"number":205,"en":"To secure privileged EXEC mode on a Cisco device, which command is recommended?","vi":"Lệnh nào được khuyến nghị để bảo vệ chế độ privileged EXEC của thiết bị Cisco?","opts":{"A":"password cisco","B":"enable password class","C":"service password-encryption","D":"enable secret class a"},"ans":"D","why":"`enable secret` là cách được khuyến nghị để bảo vệ privileged EXEC vì mật khẩu được lưu dạng băm thay vì dạng rõ.","cat":4,"ready":true,"certified":false},{"id":207,"number":206,"en":"Which of the following applications typically use UDP?","vi":"Ứng dụng nào thường dùng UDP làm giao thức vận chuyển?","opts":{"A":"File transfers","B":"Live video streaming","C":"Secure login","D":"Email eC"},"ans":"B","why":"UDP phù hợp với ứng dụng cần phản hồi nhanh, chấp nhận mất một phần dữ liệu như thoại/video trực tiếp hoặc DNS query; hãy đối chiếu lựa chọn đề.","cat":5,"ready":true,"certified":false},{"id":208,"number":207,"en":"Which benefit does SSH offer over Telnet for remotely managing a router?","vi":"SSH có lợi ích gì so với Telnet khi quản trị router từ xa?","opts":{"A":"Encryption","B":"TCP usage","C":"Authorization","D":"connections via multiple VTY lines eee"},"ans":"A","why":"SSH mã hóa dữ liệu phiên quản trị, bao gồm thông tin đăng nhập; Telnet truyền nội dung phiên ở dạng không mã hóa.","cat":4,"ready":true,"certified":false},{"id":209,"number":208,"en":"What is the purpose of the ARP cache?","vi":"Mục đích của bộ nhớ đệm ARP (ARP cache) là gì?","opts":{"A":"Prevents looping","B":"Stores MAC to IP mappings","C":"Tracks port usage","D":"Converts binary to text"},"ans":"B","why":"ARP cache giữ ánh xạ IPv4→MAC đã tìm được, tránh phải broadcast ARP Request cho mỗi gói gửi đến cùng next-hop.","cat":5,"ready":true,"certified":false},{"id":210,"number":209,"en":"What is the loopback address for IPv6?","vi":"Địa chỉ loopback trong IPv6 là gì?","opts":{"A":"127.0.0.1","B":"0.0.0.0 Cn","D":"71"},"ans":"D","why":"IPv6 loopback là `::1/128`; dùng kiểm tra ngăn xếp IPv6 nội bộ, tương đương 127.0.0.1 của IPv4.","cat":1,"ready":true,"certified":false},{"id":211,"number":210,"en":"What term refers to the amount of data that can be transmitted over a medium in a given time?","vi":"Thuật ngữ nào chỉ lượng dữ liệu có thể truyền trên môi trường trong một đơn vị thời gian?","opts":{"A":"Bandwidth","B":"Latency","C":"Throughput","D":"Goodput"},"ans":"A","why":"Bandwidth là khả năng truyền bit lý thuyết theo đơn vị thời gian, đơn vị b/s; throughput là tốc độ thực tế đo được.","cat":5,"ready":true,"certified":false},{"id":212,"number":211,"en":"What is the decimal equivalent of the /26 subnet mask?","vi":"Subnet mask ở dạng thập phân của tiền tố /26 là gì?","opts":{"A":"255.255.255.192","B":"255.255.255.0 C, 255.255.255.224","D":"255.255.255.128"},"ans":"A","why":"/26 có 26 bit 1: 24 bit tương ứng 255.255.255 và 2 bit đầu octet cuối là 11000000₂=192. Mask là 255.255.255.192.","cat":1,"ready":true,"certified":false},{"id":213,"number":212,"en":"What is the primary responsibility of the transport layer?","vi":"Trách nhiệm quan trọng nhất của lớp Transport là gì?","opts":{"A":"Formatting, or presenting, data into a compatible format.","B":"Tracking individual conversations and segmenting data.","C":"Translating domain names to IP addresses.","D":"Securing the network from external threats. CSS"},"ans":"B","why":"Transport cung cấp truyền dữ liệu end-to-end giữa tiến trình ứng dụng, dùng cổng để phân luồng; TCP bổ sung tin cậy, kiểm soát luồng.","cat":5,"ready":true,"certified":false},{"id":214,"number":213,"en":"What is the purpose of subnetting a network?","vi":"Vì sao cần chia mạng thành các subnet?","opts":{"A":"To increase the number of available host addresses in a network.","B":"To create a single, large broadcast domain.","C":"To reduce the size of the network into smaller broadcast domains.","D":"To simplify the IP addressing scheme."},"ans":"C","why":"Subnetting chia một mạng lớn thành các miền nhỏ để quản lý địa chỉ, giảm broadcast và tổ chức bảo mật/định tuyến thuận tiện hơn.","cat":5,"ready":true,"certified":false},{"id":215,"number":214,"en":"What is the purpose of the Organizationally Unique Identifier (OUI) in an Ethemet MAC address?","vi":"Phần Organizationally Unique Identifier (OUI) trong địa chỉ MAC Ethernet dùng để làm gì?","opts":{"A":"To identify the specific device on the network.","B":"To identify the vendor of the Ethemet device.","C":"To specify the network layer protocol being used.","D":"To detect errors within the Ethernet frame. SC"},"ans":"B","why":"Ba byte đầu của MAC thường tạo thành OUI do IEEE cấp, nhận diện tổ chức sản xuất giao diện mạng; phần còn lại do nhà sản xuất quản lý.","cat":5,"ready":true,"certified":false},{"id":216,"number":215,"en":"What is the purpose of the IPv6 unique local address (ULA)?","vi":"Mục đích của địa chỉ IPv6 unique local (ULA) là gì?","opts":{"A":"To allow devices to communicate with the global intemet","B":"To provide a globally unique address","C":"To allow communication within a local site without global routing","D":"To enable multicast communication within a network ee"},"ans":"C","why":"ULA thuộc FC00::/7, dùng định địa chỉ IPv6 nội bộ, không được định tuyến trên Internet công cộng mặc định, tương tự vai trò private IPv4 ở mức phạm vi.","cat":1,"ready":true,"certified":false},{"id":217,"number":216,"en":"What is a key difference between IPv4 and IPv6 packet headers?","vi":"Điểm khác biệt quan trọng giữa header IPv4 và IPv6 là gì?","opts":{"A":"IPv6 headers are simpler and have fewer fields than IPv4 headers","B":"IPv6 headers are more complex than {[Pv4 headers","C":"IPv4 headers are always smaller than (Pv6 headers","D":"IPv6 requires NAT, while IPv4 does not"},"ans":"A","why":"IPv6 header cơ bản dài cố định 40 byte và không có checksum header như IPv4; IPv6 cũng dùng địa chỉ dài 128 bit thay vì 32 bit.","cat":5,"ready":true,"certified":false},{"id":218,"number":217,"en":"What is the purpose of encoding?","vi":"Mục đích của việc mã hóa (encoding) tín hiệu mạng là gì?","opts":{"A":"To increase bandwidth","B":"To ensure the accuracy and reliability of data by checking for transmission errors","C":"To convert data into a transmittable format","D":"To compress data Ceeeeeeeeeeeeeeeeeeeeeeeeee eee e rere errr ere ee"},"ans":"C","why":"Encoding biến bit thành tín hiệu điện/quang/vô tuyến có thể truyền trên môi trường, quy định cách ánh xạ 0/1 thành mẫu tín hiệu.","cat":5,"ready":true,"certified":false},{"id":219,"number":218,"en":"What is the ANDing process used for?","vi":"Phép AND bit được dùng để làm gì trong việc xử lý địa chỉ IP?","opts":{"A":"To securely encrypt communication between multiple network endpoints","B":"To find host addresses","C":"To determine the network address","D":"To convert decimal to binary ees"},"ans":"C","why":"Phép AND bit giữa IP và subnet mask cho ra địa chỉ network vì bit mạng được giữ, bit host bị đặt thành 0.","cat":2,"ready":true,"certified":true},{"id":220,"number":219,"en":"What is the primary role of the Data Link Layer in the OSI model?","vi":"Vai trò chính của lớp Data Link trong OSI là gì?","opts":{"A":"Providing reliable data transfer between network devices","B":"Routing packets between networks I I","C":"Encrypting network data for secure transmission I l","D":"Managing user authentication and access control I I I I I I I I I I I I"},"ans":"A","why":"Data Link đóng gói packet thành frame, gắn địa chỉ MAC, điều khiển truy cập môi trường và phát hiện lỗi ở liên kết.","cat":5,"ready":true,"certified":false},{"id":221,"number":220,"en":"What is a characteristic of the User Datagram Protocol (UDP)?","vi":"Một đặc điểm của giao thức UDP là gì?","opts":{"A":"It guarantees reliable delivery of data.","B":"It is a connection-oriented protocol.","C":"It is known as a best-effort delivery protocol.","D":"It uses a three-way handshake to establish a connection."},"ans":"A","why":"UDP connectionless, không bắt tay, không bảo đảm ACK hay truyền lại ở tầng UDP; phù hợp tác vụ yêu cầu overhead thấp.","cat":5,"ready":true,"certified":false},{"id":222,"number":221,"en":"What is the purpose of the TCP three-way handshake?","vi":"Bắt tay ba bước TCP được thực hiện nhằm mục đích gì?","opts":{"A":"To establish connection state and sequence tracking","B":"To check the integrity of data sent","C":"To open multiple sockets between client and server","D":"To notify the server of a new port number"},"ans":"A","why":"TCP three-way handshake (SYN, SYN-ACK, ACK) đồng bộ số thứ tự và xác nhận hai phía sẵn sàng tạo kết nối trước khi trao đổi dữ liệu.","cat":4,"ready":true,"certified":false},{"id":223,"number":222,"en":"What is the correct sequence of commands to configure a console password on a switch?","vi":"Thứ tự lệnh đúng để cấu hình mật khẩu console trên switch là gì?","opts":{"A":"line console 0 - password cisco - login","B":"enable password cisco - login - password cisco","C":"enable console - password cisco - encrypt password","D":"password cisco - enable password - encrypt password SC SSC"},"ans":"A","why":"Các bước cấu hình mật khẩu console: `enable` → `configure terminal` → `line console 0` → `password ...` → `login`. `login` kích hoạt yêu cầu nhập mật khẩu.","cat":5,"ready":true,"certified":false},{"id":224,"number":223,"en":"What is the primary benefit of Shielded Twisted Pair (STP) over Unshielded Twisted Pair (UTP)?","vi":"Cáp STP có ưu điểm quan trọng nào so với cáp UTP?","opts":{"A":"It provides better protection against electromagnetic interference (EMI).","B":"It has a higher data transmission speed.","C":"It is more flexible and easier to install.","D":"It requires no termination standards."},"ans":"A","why":"STP có lớp bọc chống nhiễu giúp giảm EMI/RFI và crosstalk so với UTP, đổi lại chi phí và yêu cầu nối đất cao hơn.","cat":4,"ready":true,"certified":false},{"id":225,"number":224,"en":"What is the purpose of the IPv6 Neighbor Discovery Protocol (ND)?","vi":"IPv6 Neighbor Discovery (ND) có mục đích gì?","opts":{"A":"To replace ARP in IPv6 networks.","B":"To discover the best route between networks.","C":"To allow IPv6 devices to communicate using NAT.","D":"A and B."},"ans":"A","why":"Neighbor Discovery dùng ICMPv6 để tìm neighbor, phân giải MAC, phát hiện router và kiểm tra địa chỉ trùng; thay nhiều chức năng ARP IPv4.","cat":1,"ready":true,"certified":false},{"id":226,"number":225,"en":"What is a primary characteristic of the UDP protocol?","vi":"Đặc điểm chủ yếu của giao thức UDP là gì?","opts":{"A":"Connection-oriented communication","B":"Guaranteed delivery of data","C":"Minimal overhead with no error checking","D":"Flow control and congestion avoidance"},"ans":"C","why":"UDP không thiết lập kết nối và không tự truyền lại gói bị mất; header ngắn giúp giảm overhead và độ trễ.","cat":5,"ready":true,"certified":false},{"id":227,"number":226,"en":"Whal is the purpose of the subnet mask in conjunction with an IP address?","vi":"Subnet mask được sử dụng cùng địa chỉ IP để làm gì?","opts":{"A":"to uniquely identify a host on a network","B":"to identify whether the address is public or private","C":"to determine the subnet to which the host belongs","D":"to mask the IP address to outsiders"},"ans":"C","why":"Subnet mask tách phần network và host trong địa chỉ IPv4, giúp thiết bị xác định đích có cùng subnet hay cần gửi qua router.","cat":1,"ready":true,"certified":false},{"id":228,"number":227,"en":"What is the main purpose of |CMP?","vi":"Mục đích chính của giao thức ICMP là gì?","opts":{"A":"To provide reliable, connection-oriented communication.","B":"To deliver data between applications.","C":"To test and report on network connectivity and issues.","D":"To secure network devices from attacks. ee"},"ans":"C","why":"ICMP cung cấp thông báo lỗi và chẩn đoán về quá trình chuyển gói IP, ví dụ Echo Reply, Destination Unreachable và Time Exceeded.","cat":1,"ready":true,"certified":false},{"id":229,"number":228,"en":"What is the purpose of ICMP messages?","vi":"Các thông điệp ICMP được dùng vào việc gì?","opts":{"A":"to inform routers about network topology changes","B":"to ensure the delivery of an IP packet","C":"to provide feedback of IP packet transmissions","D":"to monitor the process of a domain name to IP address resolution eee"},"ans":"C","why":"ICMP thông báo các điều kiện lỗi và hỗ trợ công cụ kiểm tra đường đi/kết nối; nó không vận chuyển dữ liệu ứng dụng thay TCP/UDP.","cat":5,"ready":true,"certified":false},{"id":230,"number":229,"en":"What is the purpose of the FCS field in a frame?","vi":"Trường FCS trong frame có vai trò gì?","opts":{"A":"to obtain the MAC address of the sending node","B":"to verify the logical address of the sending node","C":"to compute the CRC header for the data field","D":"to determine if errors occurred in the transmission and reception"},"ans":"D","why":"FCS chứa giá trị CRC do bên gửi tính; bên nhận tính lại để phát hiện frame bị sửa bit khi truyền.","cat":4,"ready":true,"certified":false},{"id":231,"number":230,"en":"What is the aim of an ARP spoofing attack?","vi":"Tấn công ARP spoofing nhằm mục đích gì?","opts":{"A":"to flood the network with ARP reply broadcasts","B":"to fili switch MAC address tables with bogus addresses","C":"to associate IP addresses to the wrong MAC address","D":"to overwhelm network hosis with ARP requests ee"},"ans":"C","why":"ARP spoofing gửi ánh xạ IP–MAC giả để lừa nạn nhân gửi frame đến MAC của kẻ tấn công, có thể gây nghe lén hoặc chuyển hướng lưu lượng.","cat":5,"ready":true,"certified":false},{"id":232,"number":231,"en":"What is the effect of using the Router# copy running-config startup-config command on a router?","vi":"Lệnh `copy running-config startup-config` có tác dụng gì trên router?","opts":{"A":"The contents of ROM will change.","B":"The contents of RAM will change.","C":"The contents of NVRAM will change.","D":"The contents of fiash will change."},"ans":"C","why":"`copy running-config startup-config` chép cấu hình đang hoạt động từ RAM vào cấu hình lưu NVRAM để dùng sau lần khởi động tiếp theo.","cat":4,"ready":true,"certified":false},{"id":233,"number":232,"en":"What is the function of the CRC value that is found in the FCS field of a frame?","vi":"Giá trị CRC trong trường FCS của frame dùng để làm gì?","opts":{"A":"to verify the integrity of the received frame","B":"to verify the physical address in the frame","C":"to verify the logical address in the frame","D":"to compute the checksum header for the data field in the frame ee"},"ans":"A","why":"CRC là phép tính phát hiện sai bit trên frame; nếu CRC nhận được không khớp, frame bị coi là lỗi và thường bị loại bỏ.","cat":1,"ready":true,"certified":false},{"id":234,"number":233,"en":"What is the loopback address used for in IPv4 networking?","vi":"Địa chỉ loopback IPv4 được dùng để làm gì?","opts":{"A":"To route packets to a different network","B":"To test whether the local TCP/IP stack is functioning correctly","C":"To identify the default gateway","D":"To assign a dynamic IP address"},"ans":"B","why":"IPv4 loopback 127.0.0.1 kiểm tra ngăn xếp TCP/IP của máy mà không cần đi qua card mạng/cáp/router.","cat":1,"ready":true,"certified":false},{"id":235,"number":234,"en":"What is used in the EUI-64 process to create an IPv6 interface ID on an IPv6-enabled interface?","vi":"Cơ chế EUI-64 dùng dữ liệu nào để tạo Interface ID cho giao diện IPv6?","opts":{"A":"the MAC address of the IPv6 enabled interface","B":"a randomly generated 64-bit hexadecimal address","C":"an IPv6 address that is provided by a DHCPv6 server","D":"an IPv4 address that is configured on the interface"},"ans":"A","why":"EUI-64 có thể tạo Interface ID bằng cách tách MAC 48 bit, chèn FFFE vào giữa và đảo bit U/L; phương thức này chỉ là một cách tạo ID.","cat":1,"ready":true,"certified":false},{"id":236,"number":235,"en":"What is true about the Server Message Block protocol?","vi":"Điều nào đúng về giao thức Server Message Block (SMB)?","opts":{"A":"Different SMB message types have a different format.","B":"Clients establish a long term connection to servers.","C":"SMB messages cannot authenticate a session.","D":"SMB uses the FTP protocol fer communication. eC"},"ans":"B","why":"SMB hỗ trợ chia sẻ tệp và máy in trên mạng, chủ yếu qua TCP/445 trong triển khai hiện đại; không phải giao thức truyền web HTTP.","cat":4,"ready":true,"certified":false},{"id":237,"number":236,"en":"What is the auto-MDIX feature on a switch?","vi":"Tính năng auto-MDIX trên switch là gì?","opts":{"A":"the automatic configuration of an interface for 10/100/1000 Mb/s operation","B":"the automatic configuration of an interface for a straight-through or a crossover Ethemet cable connection","C":"the automatic configuration of full-duplex operation over a single Ethernet copper or optical cable","D":"the ability to turn a switch interface on or off accordingly if an active connection is detected aaa"},"ans":"B","why":"Auto-MDIX tự xác định và điều chỉnh cặp transmit/receive trên cổng Ethernet, nên nhiều thiết bị hiện đại dùng cả cáp thẳng hoặc cáp chéo.","cat":0,"ready":true,"certified":false},{"id":238,"number":237,"en":"What is the primary purpose of the ICMP protocol?","vi":"Nhiệm vụ chủ yếu của ICMP là gì?","opts":{"A":"To route packets across different networks","B":"To provide feedback about issues related to IP packet processing","C":"To encrypt data before transmission","D":"To assign IP addresses to devices ee eee"},"ans":"B","why":"ICMP hỗ trợ phát hiện lỗi và chẩn đoán (ping/traceroute); không dùng để truyền dữ liệu ứng dụng đáng tin cậy như TCP.","cat":5,"ready":true,"certified":false},{"id":239,"number":238,"en":"What is the default gateway used for in a network?","vi":"Default gateway trong mạng được sử dụng để làm gì?","opts":{"A":"To route traffic to local devices","B":"To assign IP addresses dynamically","C":"To route traffic to devices on another network","D":"To provide DNS services eC"},"ans":"C","why":"Default gateway là router next-hop mà host chuyển gói khi đích nằm ngoài subnet cục bộ.","cat":1,"ready":true,"certified":false},{"id":240,"number":239,"en":"What is a primary role of the Physical layer in transmitting data on the network?","vi":"Chức năng chính của lớp Physical khi truyền dữ liệu mạng là gì?","opts":{"A":"create the signals that represent the bits in each frame on to the media","B":"provide physical addressing to the devices","C":"determine the path packets take through the network","D":"control data access to the media"},"ans":"A","why":"Physical layer biến bit thành tín hiệu và truyền qua cáp/sóng; Data Link mới xử lý frame, địa chỉ MAC và FCS.","cat":5,"ready":true,"certified":false},{"id":241,"number":240,"en":"What is the main purpose of a subnet mask in IPv4 addressing?","vi":"Mục đích của subnet mask trong định địa chỉ IPv4 là gì?","opts":{"A":"To identify the gateway of the network","B":"To determine the network and host portions of an IP address","C":"To provide security by masking IP addresses","D":"To route packets between networks Dd"},"ans":"B","why":"Subnet mask xác định bit network và host, dùng cùng IP để tính network address và quyết định đích cùng mạng hay khác mạng.","cat":1,"ready":true,"certified":false},{"id":242,"number":241,"en":"What is the purpose of the Neighbor Solicitation (NS) message in ICMPv6?","vi":"Mục đích của thông điệp Neighbor Solicitation (NS) trong ICMPv6 là gì?","opts":{"A":"To discover the MAC address of a neighboring device.","B":"To request an IPv6 address from a router.","C":"To check the reachability of a host.","D":"To test the link quality."},"ans":"A","why":"Neighbor Solicitation dùng để phân giải địa chỉ lớp 2 (MAC) của neighbor IPv6, tương đương ARP Request trong IPv4. Chọn A.","cat":5,"ready":true,"certified":false},{"id":243,"number":242,"en":"What is the purpose of ICMP messages?","vi":"Thông điệp ICMP có mục đích gì trong mạng IP?","opts":{"A":"to inform routers about network topology changes 8. fo ensure the delivery of an IP packet","C":"to provide feedback of IP packet transmissions","D":"to monitor the process of a domain name to IP address resolution"},"ans":"C","why":"ICMP cung cấp phản hồi về lỗi mạng và khả năng liên lạc; ping sử dụng Echo Request/Reply, traceroute tận dụng Time Exceeded.","cat":5,"ready":true,"certified":false},{"id":244,"number":243,"en":"What is a function of the tracert command that differs from the ping command when they are used on a workstation?","vi":"Tracert khác ping ở chức năng nào khi chạy trên máy tính?","opts":{"A":"The tracert command reaches the destination faster","B":"The tracert command shows the information of routers in the path","C":"The tracert command sends one ICMP message to each hop in the path.","D":"The tracert command is used to test the connectivity between two devices. a"},"ans":"B","why":"`ping` chủ yếu kiểm tra có đến đích được không và RTT; `tracert`/`traceroute` hiển thị các hop/router trung gian dọc đường.","cat":5,"ready":true,"certified":false},{"id":245,"number":244,"en":"What are the four basic operations of the network layer?","vi":"Bốn thao tác cơ bản của lớp Network là gì?","opts":{"A":"Addressing, Routing, Filtering, Framing","B":"Addressing, Encryption, Decryption, Routing","C":"Addressing, Encapsulation, Routing, De-encapsulation","D":"Encoding, Framing, Filtering, Switching"},"ans":"C","why":"Chức năng lớp Network thường bao gồm định địa chỉ logic, đóng gói IP, chọn đường/định tuyến và chuyển tiếp/giải đóng gói tại đích theo cách mô tả trong giáo trình.","cat":0,"ready":true,"certified":false},{"id":246,"number":245,"en":"What command will prevent all unencrypted passwords from displaying in plain text in a configuration file?","vi":"Lệnh nào ngăn mật khẩu chưa mã hóa hiển thị dưới dạng văn bản rõ trong tệp cấu hình?","opts":{"A":"(config)}# enable password secret","B":"(config)# enable secret Secret_Password","C":"(config-line}# password secret","D":"(config}# service password-encryption","E":"(config)# enable secret Encrypted_ Password"},"ans":"D","why":"`service password-encryption` làm mờ các mật khẩu kiểu plaintext được lưu trong cấu hình bằng mã hóa Type 7; không thay cho `enable secret` và không đủ bảo mật mạnh.","cat":4,"ready":true,"certified":false},{"id":247,"number":246,"en":"What characteristic describes spyware?","vi":"Đặc điểm nào mô tả phần mềm gián điệp (spyware)?","opts":{"A":"software that is installed on a user device and collects information about the user","B":"an attack that slows or crashes a device or network service","C":"the use of stolen credentials to access private data","D":"a network device that filters access and traffic coming into a network"},"ans":"A","why":"Spyware thu thập thông tin hoạt động/dữ liệu người dùng trái phép, thường chạy ngầm và có thể gửi dữ liệu ra ngoài.","cat":2,"ready":true,"certified":false},{"id":248,"number":247,"en":"What does the \"Time Exceeded” ICMP message indicate?","vi":"Thông điệp ICMP Time Exceeded cho biết điều gì?","opts":{"A":"The destination host is down","B":"The packet's TTL has reached zero","D":"The network is congested"},"ans":"B","why":"ICMP Time Exceeded được router gửi khi TTL (IPv4) hoặc Hop Limit (IPv6) của gói về 0, nên gói không thể tiếp tục được chuyển tiếp.","cat":5,"ready":true,"certified":false},{"id":249,"number":248,"en":"What does a client do when it has UDP datagrams to send?","vi":"Khi có datagram UDP cần gửi, máy khách sẽ làm gì?","opts":{"A":"it just sends the datagrams.","B":"it queries the server to see if it is ready to receive data.","C":"It sends a simplified three-way handshake fo the server.","D":"It sends to the server a segment with the SYN flag set to synchronize the conversation. be"},"ans":"A","why":"UDP chỉ đóng gói datagram với địa chỉ/port và gửi xuống IP, không thực hiện thiết lập kết nối hay chờ ACK từ ứng dụng nhận.","cat":5,"ready":true,"certified":false},{"id":250,"number":249,"en":"What function does pressing the Tab key have when entering a command in |OS?","vi":"Nhấn phím Tab khi nhập lệnh trên Cisco IOS có tác dụng gì?","opts":{"A":"It aborts the current command and returns to configuration mode.","B":"It exits configuration mode and returns to user EXEC mode.","C":"It moves the cursor to the beginning of the next line.","D":"It completes the remainder of a partially typed word in a command."},"ans":"D","why":"Phím Tab trong IOS tự hoàn thành phần còn lại của lệnh/từ khóa nếu đủ duy nhất, giúp nhập lệnh nhanh hơn.","cat":4,"ready":true,"certified":false},{"id":251,"number":250,"en":"What happens when a switch receives a frame and the calculated CRC value is different than the value that is in the FCS field?","vi":"Switch xử lý thế nào khi giá trị CRC vừa tính khác giá trị trong trường FCS của frame?","opts":{"A":"The switch places the new CRC value in the FCS field and forwards the frame.","C":"The switch drops the frame.","D":"The switch floods the frame to all ports except the port through which the frame arrived to notify the hosts of the error."},"ans":"C","why":"Switch kiểm tra CRC; khi CRC tính lại không bằng FCS trong frame, nó loại bỏ frame lỗi thay vì chuyển tiếp.","cat":2,"ready":true,"certified":false},{"id":252,"number":251,"en":"What happens if an IPv6 device detects a duplicate address during startup?","vi":"Nếu thiết bị IPv6 phát hiện địa chỉ trùng lặp khi khởi động, nó sẽ xử lý thế nào?","opts":{"A":"It sends a Neighbor Advertisement (NA) to notify the sender.","B":"It automatically requests a new IP from DHCPv6.","C":"It assigns a private address instead.","D":"It ignores the conflict and continues using the address."},"ans":"A","why":"Câu nguồn có vấn đề: khi DAD phát hiện địa chỉ trùng, thiết bị không được dùng địa chỉ đó. Phương án A nói gửi Neighbor Advertisement không mô tả chính xác hành vi của chính thiết bị vừa phát hiện trùng; chưa có đáp án phù hợp hoàn toàn nên không chấm tự động.","cat":5,"ready":false,"certified":false},{"id":253,"number":252,"en":"What happens when the transport input ssh command is entered on the switch vty lines?","vi":"Lệnh `transport input ssh` trên đường VTY của switch có tác dụng gì?","opts":{"A":"The SSH client on the switch is enabled.","B":"Communication between the switch and remote users is encrypted.","C":"The switch requires a username/password combination for remote access.","D":"The switch requires remote connections via a proprietary client software."},"ans":"B","why":"`transport input ssh` trên line VTY chỉ cho phép kết nối quản trị đến qua SSH, chặn Telnet trên các line đã cấu hình.","cat":4,"ready":true,"certified":false},{"id":254,"number":253,"en":"What property of ARP causes cached IP-to-MAC mappings to remain in memory longer?","vi":"Đặc tính nào của ARP khiến ánh xạ IP–MAC được lưu tạm trong bộ nhớ?","opts":{"A":"Entries in an ARP table are time-stamped and are purged after the timeout expires.","B":"A static IP-to-MAC address entry can be entered manually into an ARP table.","C":"The type field 0x806 appears in the header of the Ethernet frame.","D":"The port-to-MAC address table on a switch has the same entries as the ARP table on the switch."},"ans":"A","why":"ARP cache duy trì bản ghi IP–MAC trong một khoảng thời gian (aging timer), nhờ đó tránh phải phân giải lại địa chỉ liên tục.","cat":1,"ready":true,"certified":false},{"id":255,"number":254,"en":"What source IP address does a router use by default when the traceroute command is issued?","vi":"Router mặc định sử dụng địa chỉ IP nguồn nào khi thực hiện lệnh traceroute?","opts":{"A":"The highest configured IP address on the router.","B":"A loopback IP address.","C":"The IP address of the outbound interface.","D":"The lowest configured IP address on the router."},"ans":"C","why":"Nếu không cấu hình nguồn cụ thể, router thường lấy địa chỉ IP của interface mà gói traceroute đi ra làm địa chỉ nguồn. Vì vậy chọn C.","cat":1,"ready":true,"certified":false},{"id":256,"number":255,"en":"What statement describes the function of the Address Resolution Protocol?","vi":"Phát biểu nào mô tả đúng chức năng của giao thức ARP?","opts":{"A":"ARP is used to discover the IP address of any host on a different network.","B":"ARP is used to discover the IP address of any host on the local network.","C":"ARP is used to discover the MAC address of any host on a different network.","D":"ARP is used to discover the MAC address of any host on the local network."},"ans":"D","why":"ARP tìm địa chỉ MAC tương ứng với một IPv4 của neighbor trong cùng LAN. ARP không tìm địa chỉ IP của thiết bị ở mạng xa. Chọn D.","cat":0,"ready":true,"certified":false},{"id":257,"number":256,"en":"What destination MAC address would be included in a frame sent from a source device to a destination device on a remote local network?","vi":"Khi gửi frame tới thiết bị ở một mạng cục bộ khác, frame phải dùng địa chỉ MAC đích nào?","opts":{"A":"A broadcast MAC address of FF-FF-FF-FF-FF-FF.","B":"The MAC address of the destination device.","C":"The MAC address of the local router interface."},"ans":"C","why":"Khi IP đích ở mạng xa, host đóng frame tới địa chỉ MAC của giao diện router/default gateway trên LAN của mình. Trong các lựa chọn có ba phương án, đáp án đúng là C (khóa nguồn D không hợp lệ).","cat":1,"ready":true,"certified":true},{"id":258,"number":257,"en":"What type of applications are best suited for using UDP?","vi":"Loại ứng dụng nào thích hợp nhất để sử dụng UDP?","opts":{"A":"applications that are sensitive to delay","B":"applications that need reliable delivery","C":"applications that require retransmission of lost segments","D":"applications that are sensitive to packet loss"},"ans":"A","why":"UDP thích hợp ứng dụng ưu tiên độ trễ thấp, nhiều trao đổi ngắn hoặc tự quản lý độ tin cậy như thoại/video, DNS và trò chơi trực tuyến.","cat":5,"ready":true,"certified":false},{"id":259,"number":258,"en":"What will a host on an Ethemet network do if it receives a frame with a unicast destination MAC address that does not match its own MAC address?","vi":"Host Ethernet nhận frame có địa chỉ MAC unicast đích khác MAC của chính nó sẽ làm gì?","opts":{"A":"It will discard the frame.","B":"It will forward the frame to the next host","C":"It will remove the frame from the media.","D":"It will strip off the data-link frame to check the destination IP address."},"ans":"A","why":"NIC nhận frame unicast có MAC đích không trùng MAC của mình thường bỏ frame, ngoại trừ những cấu hình đặc biệt như promiscuous mode.","cat":5,"ready":true,"certified":false},{"id":260,"number":259,"en":"What will happen if the default gateway address is incorrectly configured on a host?","vi":"Điều gì xảy ra nếu default gateway trên host được cấu hình sai?","opts":{"A":"The host cannot communicate with other hosts in the local network.","B":"The switch will not forward packets initiated by the host.","C":"The host will have to use ARP to determine the correct address of the default gateway.","D":"The host cannot communicate with hosts in other networks.","E":"A ping from the host fo 127.0.0.1 would not be successful. eer"},"ans":"D","why":"Cấu hình default gateway sai khiến host vẫn liên lạc được với các thiết bị cùng subnet nhưng không truy cập được đích ở mạng khác.","cat":2,"ready":true,"certified":false,"figure":"data:image/webp;base64,UklGRjg9AABXRUJQVlA4ICw9AADQAQGdASoUA8EBPnk8mUoko6Iho1KJoJAPCWlu/GwZ5LLXaX6Pdfer/bpc9b58fTM+rFvMX+pyWzwz/SPyI8yX6D/W/7d+z39m9I/xH5T+3/1//I/6X+/+1f/b+Gfzn95/6f9//wvsP/FvsN+R/vv7s/4r2l/1ngj8B/6/+w+wL+Qfyb/Af2H8kPUL/yP7z3R2j/6z/tf5b2BfUH5r/pv7h/lP/f/mPap9c/wX+N/cP+x//////RH5b/Pf8l/gP8T/6/7n9gH8Z/n3+Y/vv74/5D/////7N/zvhQfd/9X+3XwB/y/+q/73+//5v9ovpL/j//J/jv9r+2Xto/Mf8Z/4v8l/rPkG/lP9d/5X+B/1P7cfPl7Mv3f///uy/s5//xv+hDmz1oEqHTExvovdQy5jfRe6hlzG+i91AU1XRL7P1HWTs8caYemJjfRe6hlzG+i91DLmN9F7XPAeHf/U7QUCqYYKMZs6/LTuVR1FkynJ2A1HTVqUTa6rGXAIjoB+LfPaEBsb6L3UCJVABOoVRIYz5fcsKJqgDt+9ZRa4yFFahz64GyNlfpitCM/SCn8shkpR1AFct1clS5sQdi0FC9cmmw56f0qMwIzY6CVzWiakxjFUcY9H8kPg1ihNJGMEi0sBH0AQEqF4tpOrEJLCCt4UvzEDiCnmqLJCq9yeV2dT7uxcQm9s3UHuo3rrXCPzNAzHxz4hSOC4GR6jDUz8G+W3Q85vIZ5x4vGNixq
