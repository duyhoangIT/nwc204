an process at one time"},"ans":"C","why":"TCP receive window phản ánh dung lượng bộ đệm phía nhận còn sẵn để điều khiển luồng; congestion window còn phụ thuộc trạng thái tắc nghẽn mạng.","cat":5,"ready":true,"certified":false},{"id":265,"number":264,"en":"Which statement about IPv6 addresses is true?","vi":"Nhận định nào đúng về địa chỉ IPv6?","opts":{"A":"IPv6 addresses are expressed in decimal format.","B":"IPv6 addresses use 128 bits and are expressed in hexadecimal format.","C":"IPv6 addresses use 32 bits and are expressed in binary format.","D":"IPv6 addresses are composed of two parts: network and host."},"ans":"B","why":"Địa chỉ IPv6 dài 128 bit và có nhiều phạm vi như global, link-local, ULA; không hỗ trợ broadcast. Chọn phát biểu phù hợp nội dung đáp án.","cat":1,"ready":true,"certified":false},{"id":266,"number":265,"en":"Which statement describes the treatment of ARP requests on the local link?","vi":"Các switch/host trong cùng liên kết xử lý ARP Request thế nào?","opts":{"A":"They must be forwarded by all routers on the focal network.","B":"They are received and processed by every device on the local network.","C":"They are dropped by all switches on the local network.","D":"They are received and processed only by the target device. ee"},"ans":"B","why":"ARP Request gửi dưới dạng Ethernet broadcast và được truyền trong miền broadcast; host đúng địa chỉ IPv4 trả ARP Reply có địa chỉ MAC của mình.","cat":1,"ready":true,"certified":false},{"id":267,"number":266,"en":"Which statement is correct about network protocols?","vi":"Nhận định nào đúng về giao thức mạng?","opts":{"A":"Network protocols define the type of hardware used and its rack mounting.","B":"They define how messages are exchanged between source and destination.","C":"They all function in the network access layer of TCP/IP.","D":"They are only required for messages between devices on remote networks."},"ans":"B","why":"Giao thức mạng là tập quy tắc định dạng, thời điểm và cách trao đổi thông điệp; các bên liên lạc phải hiểu cùng quy tắc.","cat":2,"ready":true,"certified":false},{"id":268,"number":267,"en":"Which statement describes a feature of the IP protocol?","vi":"Phát biểu nào đúng về đặc điểm của giao thức IP?","opts":{"A":"IP encapsulation is modified based on network media.","B":"IP relies on Layer 2 protocols for transmission error control.","C":"MAC addresses are used during the IP packet encapsulation.","D":"IP relies on upper layer services to handle situations of missing or out-of-order packets."},"ans":"D","why":"IP làm việc theo nguyên tắc best effort và không tự xử lý gói mất hoặc sai thứ tự. Các dịch vụ tầng trên (ví dụ TCP) có thể cung cấp tin cậy. Chọn D.","cat":5,"ready":true,"certified":false},{"id":269,"number":268,"en":"What action does a switch take when it receives a frame with a destination MAC address that is not in its MAC address table?","vi":"Switch làm gì khi nhận frame có MAC đích chưa xuất hiện trong bảng MAC?","opts":{"A":"It discards the frame immediately.","C":"It forwards the frame out all ports except the incoming port.","D":"It sends an ARP request to find the destination device. GO -“CtisSCSCSCSC('sA"},"ans":"C","why":"Khi MAC đích chưa có trong CAM table, switch flood unknown unicast đến các cổng cùng VLAN trừ cổng nhận; đồng thời học MAC nguồn.","cat":2,"ready":true,"certified":false},{"id":270,"number":269,"en":"Which statement accurately describes a TCP/IP encapsulation process when a PC is sending data to the network?","vi":"Nhận định nào mô tả đúng quá trình đóng gói TCP/IP khi PC gửi dữ liệu?","opts":{"A":"Data is sent from the intemet layer to the network access layer.","B":"Packets are sent from the network access layer to the transport layer.","C":"Segments are sent from the transport fayer to the internet layer.","D":"Frames are sent from the network access layer to the internet layer."},"ans":"C","why":"Dữ liệu ứng dụng được gắn TCP/UDP header rồi IP header, sau đó Ethernet frame header/trailer; các lớp đóng gói theo chiều từ trên xuống.","cat":2,"ready":true,"certified":false},{"id":271,"number":270,"en":"Which statement describes the half-duplex mode of data transmission?","vi":"Truyền half-duplex có đặc điểm gì?","opts":{"A":"Data that is transmitted over the network can only flow in one direction.","B":"Data that is transmitted over the network flows in both directions at the same time.","C":"Data that is transmitted over the network flows in one direction to many different destinations simultaneously.","D":"Data that is transmitted over the network flows in one direction at a time. Gn"},"ans":"D","why":"Half-duplex cho phép truyền theo hai hướng nhưng không đồng thời trên cùng kênh; full-duplex có thể gửi/nhận cùng lúc.","cat":1,"ready":true,"certified":false},{"id":272,"number":271,"en":"Which statement describes the use of powerline networking technology?","vi":"Phương án nào mô tả đúng công nghệ truyền dữ liệu qua đường dây điện (powerline networking)?","opts":{"A":"New “smart” electrical cabling is used to extend an existing home LAN.","B":"A home LAN is installed without the use of physical cabling.","C":"A device connects to an existing home LAN using an adapter and an existing electrical outlet.","D":"Wireless access points use powerline adapters to distribute data through the home LAN. nn S-“CsSCSC'“'NCti'C( (“SSS"},"ans":"C","why":"Powerline networking dùng đường dây điện hiện có để mang tín hiệu dữ liệu bằng bộ chuyển đổi thích hợp, không thay thế mọi yêu cầu an toàn/nhiễu của Ethernet.","cat":5,"ready":true,"certified":false},{"id":273,"number":272,"en":"Which statement describes a characteristic of the frame header fields of the data link layer?","vi":"Nhận định nào đúng về các trường trong header frame của lớp Data Link?","opts":{"A":"They all include the flow control and logical connection fields.","C":"They vary depending on protocols.","D":"They include information on user applications."},"ans":"C","why":"Header Data Link thay đổi theo loại giao thức L2 nhưng thường chứa địa chỉ/điều khiển phục vụ chuyển frame trên liên kết, không giữ cố định địa chỉ IP nguồn/đích end-to-end.","cat":1,"ready":true,"certified":false},{"id":274,"number":273,"en":"Which statement is true about the CSMA/CD access method that is used in Ethernet?","vi":"Nhận định nào đúng về phương pháp truy cập CSMA/CD trong Ethernet?","opts":{"A":"When a device hears a carrier signal and transmits, a collision cannot occur.","B":"A jamming signal causes only devices that caused the collision to execute a backoff algorithm.","C":"All network devices must listen before transmitting.","D":"Devices involved in a collision get priority to transmit after the backoff period. ener eee reer renner"},"ans":"C","why":"CSMA/CD là cơ chế Ethernet half-duplex truyền thống: lắng nghe kênh, phát hiện collision, gửi jam signal và chờ backoff; không sử dụng trong Ethernet full-duplex hiện đại.","cat":5,"ready":true,"certified":false},{"id":275,"number":274,"en":"Which scenario describes a function provided by the transport layer?","vi":"Tình huống nào minh họa chức năng của lớp Transport?","opts":{"A":"A student is using a classroom VoIP phone to call home. The unique identifier burned into the phone is a transport layer address used to contact another network device on the same network.","B":"A student is playing 4 short web-based movie with sound. The movie and sound are encoded within the transport layer header.","C":"A student has two web browser windows open in order to access two web sites. The transport layer ensures the correct web page is delivered to the correct browser window.","D":"A corporate worker is accessing a web server located on a corporate network. The transport layer formats the screen so the web page appears properly no matter what device is being used to view the web site."},"ans":"C","why":"Transport phân đoạn dữ liệu, dùng port để phân biệt ứng dụng, thực hiện quản lý luồng/tin cậy tùy TCP/UDP; tình huống đúng phải nói tới truyền dữ liệu end-to-end.","cat":2,"ready":true,"certified":false},{"id":276,"number":275,"en":"Why would a Layer 2 switch need an IP address?","vi":"Vì sao switch Layer 2 cần được cấu hình địa chỉ IP?","opts":{"A":"to enable the switch to send broadcast frames to attached PCs","B":"to enable the switch to function as a default gateway","C":"to enable the switch to be managed remotely","D":"to enable the switch to receive frames from attached PCs"},"ans":"C","why":"Switch Layer 2 cần IP trên SVI để quản trị từ xa qua SSH/Telnet/SNMP; IP này không bắt buộc để switch chuyển frame theo MAC.","cat":5,"ready":true,"certified":false},{"id":277,"number":276,"en":"Why is NAT not needed in IPv6?","vi":"Vì sao IPv6 thường không cần sử dụng NAT như IPv4?","opts":{"A":"Because IPv6 has integrated security, there is no need to hide the IPv6 addresses of internal networks.","B":"Any host or user can get a public !Pv6 network address because the number of available IPv6 addresses is extremely large. I","C":"The problems that are induced by NAT applications are solved because the IPv6 header improves packet l handling by intermediate routers.","D":"The end-to-end connectivity problems that are caused by NAT are solved because the number of routes increases with the number of nodes that are connected to the Internet. I I I I I I I I I I I eC"},"ans":"B","why":"IPv6 có không gian địa chỉ rất lớn cho host global unicast, nên thường không cần NAT để tiết kiệm địa chỉ như IPv4; firewall vẫn cần thiết cho bảo mật.","cat":5,"ready":true,"certified":false},{"id":278,"number":277,"en":"How Is soni aifferent trom telnet?","vi":"SSH khác Telnet ở điểm nào?","opts":{"A":"SSH makes connections over the network, whereas Telnet is for out-of-band access.","B":"SSH provides security to remote sessions by encrypting messages and using user authentication. Telnet is considered insecure and sends messages in plaintext.","C":"SSH requires the use of the PuTTY terminal emulation program. Tera Term must be used to connect to devices through the use of Telnet.","D":"SSH must be configured over an active network connection, whereas Telnet is used to connect to a device from a console connection. eee"},"ans":"B","why":"SSH mã hóa toàn bộ phiên quản trị và xác thực máy chủ, trong khi Telnet không mã hóa dữ liệu phiên nên dễ bị đọc trộm trên đường truyền.","cat":4,"ready":true,"certified":false},{"id":279,"number":278,"en":"How are port numbers used in the TCP/IP encapsulation process?","vi":"Trong đóng gói TCP/IP, số cổng được dùng thế nào để phân biệt các phiên liên lạc?","opts":{"A":"Source and destination port numbers are not necessary when UDP is used.","B":"Source port and destination port numbers are randomly generated.","C":"If multiple conversations use the same service, the source port number is used to track separate conversations.","D":"Destination port numbers are assigned automatically and cannot be changed."},"ans":"C","why":"Port đích chỉ định dịch vụ phía nhận; port nguồn phân biệt nhiều phiên ứng dụng đồng thời dù cùng dùng một dịch vụ. Do đó chọn C.","cat":5,"ready":true,"certified":false},{"id":280,"number":279,"en":"How does the ARP process use an IPv4 address?","vi":"ARP sử dụng địa chỉ IPv4 như thế nào trong quá trình phân giải địa chỉ?","opts":{"A":"to determine the MAC address of the remote destination host","B":"to determine the MAC address of a device on the same network","D":"to determine the network number based on the number of bits in the IP address","E":"Router solicitation"},"ans":"B","why":"ARP lấy địa chỉ IPv4 đích cùng mạng hoặc IPv4 next-hop gateway để hỏi ánh xạ sang MAC nhằm đóng gói Ethernet frame.","cat":1,"ready":true,"certified":false},{"id":281,"number":280,"en":"How does a router process a packet when no matching route exists in the routing table?","vi":"Router xử lý gói ra sao khi không có tuyến phù hợp trong bảng định tuyến?","opts":{"A":"It forwards the packet using the default route (if configured), or drops it.","B":"It sends the packet to all interfaces.","C":"It assigns a random route to the packet.","D":"It broadcasts the packet across the network."},"ans":"A","why":"Nếu router không có tuyến khớp, kể cả default route, nó loại gói và thường gửi ICMP Destination Unreachable về nguồn.","cat":2,"ready":true,"certified":false},{"id":282,"number":281,"en":"A user cannot connect to the file server. The help desk technician asks the user to ping the default gateway configured on the workstation. What is the purpose of this ping command?","vi":"Người dùng không truy cập được file server. Kỹ thuật viên yêu cầu ping địa chỉ gateway trên máy. Thao tác này nhằm kiểm tra điều gì?","opts":{"A":"To obtain a dynamic IP address from the server.","B":"To request that the gateway forward the connection request to the file server.","C":"To test that the host has the capability to reach hosts on other networks.","D":"To resolve the domain name of the file server to its IP address."},"ans":"C","why":"Ping default gateway kiểm tra máy có thể đi đến router của LAN hay không, là bước cơ bản để xác định khả năng ra mạng khác. Vì thế chọn C.","cat":1,"ready":true,"certified":false},{"id":283,"number":282,"en":"What is the | fastest way a network administrator could test whether the banner is properly configured? l A. Reboot the device.","vi":"Quản trị viên muốn kiểm tra nhanh banner thông báo đã cấu hình trên Cisco. Cách nào nhanh nhất?","opts":{"A":"Reboot the device.","B":"Enter CTRL-Z at the privileged mode prompt.","C":"Exit global configuration mode.","D":"Power cycle the device. l","E":"Exit privileged EXEC mode and press Enter. eC"},"ans":"E","why":"Banner Cisco được hiển thị khi bắt đầu phiên đăng nhập; cách kiểm tra nhanh là thoát phiên rồi truy cập lại console/VTY để xem thông báo.","cat":4,"ready":true,"certified":true},{"id":284,"number":283,"en":"A computer can access devices on the same network but cannot access devices on other networks. What is the probable cause of this problem?","vi":"Máy tính truy cập được thiết bị cùng mạng nhưng không thể truy cập mạng khác. Nguyên nhân có khả năng nhất là gì?","opts":{"A":"The cable is not connected properly to the NIC","B":"The computer has an invalid IP address.","C":"The computer has an incorrect subnet mask.","D":"The computer has an invalid default gateway address."},"ans":"D","why":"PC vẫn truy cập được LAN nhưng không đi ra mạng khác thường do default gateway bị thiếu hoặc sai, vì các đích ngoài subnet cần router chuyển tiếp.","cat":2,"ready":true,"certified":false},{"id":285,"number":284,"en":"A technician uses the ping 127.0.0.1 command. What is the technician testing?","vi":"Lệnh `ping 127.0.0.1` kiểm tra thành phần nào trên máy tính?","opts":{"A":"the TCPAP stack on a network host","B":"connectivity between two adjacent Cisco devices","C":"connectivity between a PC and the default gateway","D":"connectivity between two PCs on the same network","E":"physical connectivity of a particular PC and the network"},"ans":"A","why":"`ping 127.0.0.1` chỉ kiểm tra loopback TCP/IP trên host, không kiểm tra switch/router hay đường cáp bên ngoài.","cat":2,"ready":true,"certified":false},{"id":286,"number":285,"en":"A technician configures a router interface with “ipv6 address fe80::1 link-local”. What is the purpose of this address?","vi":"Lệnh `ipv6 address fe80::1 link-local` trên cổng router dùng để thiết lập điều gì?","opts":{"A":"lt enables communication on the local link","B":"It routes packets to other networks","C":"It acts as a default gateway for global IPv6 traffic","D":"Itis a multicast address"},"ans":"A","why":"Lệnh đặt địa chỉ link-local `fe80::1` trên interface, dùng giao tiếp IPv6 cùng link và làm next-hop của một số giao thức.","cat":4,"ready":true,"certified":false},{"id":287,"number":286,"en":"What could explain this?","vi":"Cổng G0/0/0 của router vẫn down dù cấu hình đúng. Nguyên nhân nào có thể giải thích?","opts":{"A":"The *no shutdown’ command was not applied","B":"There is no device connected to the interface","C":"The IP address is not unique","D":"The password was not encrypted"},"ans":"A","why":"Interface có thể ở trạng thái administratively down nếu chưa `no shutdown`, hoặc physical down do cáp/đầu kia; kiểm tra `show ip interface brief` và kết nối.","cat":2,"ready":true,"certified":false},{"id":288,"number":287,"en":"A network administrator enters the service password-encryption command into the configuration mode of a router. What does this command accomplish?","vi":"Lệnh `service password-encryption` trong cấu hình router thực hiện chức năng gì?","opts":{"A":"This command encrypts passwords as they are transmitted across serial WAN links.","B":"This command prevents someone from viewing the running configuration passwords.","C":"This command enables a strong encryption algorithm for the enable secret password command.","D":"This command automatically encrypts passwords in configuration files that are currently stored in NVRAM.","E":"This command provides an exclusive encrypted password for external service personnel who are required to do router maintenance."},"ans":"B","why":"`service password-encryption` mã hóa kiểu Type 7 cho những mật khẩu không mã hóa trong cấu hình IOS để chúng không hiện trực tiếp dạng rõ.","cat":4,"ready":true,"certified":false},{"id":289,"number":288,"en":"what point would a router in the path to the destination device drop the packet?","vi":"Trong traceroute IPv6, router dọc đường loại bỏ gói tin ở thời điểm nào?","opts":{"A":"when the value of the Hop Limit field reaches 255","B":"when the value of the Hop Limit field reaches zero","C":"when the router receives an ICMP time exceeded message","D":"when the target host responds with an ICMP echo reply message"},"ans":"B","why":"Router giảm Hop Limit IPv6 sau mỗi hop; khi xuống 0 sẽ hủy packet và thường gửi ICMPv6 Time Exceeded, cho traceroute biết vị trí hop đó.","cat":1,"ready":true,"certified":false},{"id":290,"number":289,"en":"Which approach best provides cost effective redundancy for the Internet connection?","vi":"Công ty nhỏ dùng web server quan trọng và chỉ có một đường Internet thuê riêng. Cách nào tạo dự phòng Internet tiết kiệm chi phí?","opts":{"A":"Add a second NIC to the web server.","B":"Add another web server to prepare failover support.","C":"Add a connection to the Internet via a DSL line to another ISP.","D":"Add multiple connections between the switches and the edge router. ee"},"ans":"C","why":"Có thể dùng kết nối Internet dự phòng qua công nghệ chi phí thấp (như broadband/DSL) thay vì thuê thêm một đường leased line hoàn chỉnh, và cấu hình failover.","cat":5,"ready":true,"certified":false},{"id":291,"number":290,"en":"The global configuration command ip default-gateway 172.16.100.1 is applied to a switch. What is the effect of this command?","vi":"Lệnh `ip default-gateway 172.16.100.1` trong cấu hình switch có hiệu lực gì?","opts":{"A":"The switch will have a management interface with the address 172.16.100.1.","B":"The switch can be remotely managed from a host on another network.","C":"The switch can communicate with other hosts on the 172.16.100.0 network.","D":"The switch is limited to sending and receiving frames to and from the gateway 172.16.100.1."},"ans":"B","why":"`ip default-gateway 172.16.100.1` đặt cổng mặc định để switch Layer 2 có thể gửi lưu lượng quản trị tới host ở mạng khác; không bật định tuyến IP cho switch.","cat":4,"ready":true,"certified":false},{"id":292,"number":291,"en":"This is a function of the OSI session layer.","vi":"Đâu là một chức năng của lớp Session trong mô hình OSI?","opts":{"A":"compress and decompress data","B":"provide an interface between applications","C":"format data for the application tayer","D":"exchange of information to initiate dialog between peers"},"ans":"D","why":"Lớp Session thiết lập, duy trì và kết thúc phiên giữa các ứng dụng, đồng thời hỗ trợ đồng bộ/khôi phục phiên theo mô hình OSI.","cat":5,"ready":true,"certified":false},{"id":293,"number":292,"en":"With the use of unshielded twisted-pair copper wire in a network, what causes crosstalk within the cable pairs?","vi":"Trong cáp đồng UTP, nguyên nhân nào gây nhiễu xuyên âm (crosstalk) giữa các đôi dây?","opts":{"A":"the magnetic field around the adjacent pairs of wire","B":"the use of braided wire to shield the adjacent wire pairs","C":"the reflection of the electrical wave back from the far end of the cable","D":"the collision caused by two nodes trying to use the media simultaneously ee"},"ans":"A","why":"Crosstalk xuất hiện do trường điện từ của tín hiệu trên một cặp dây gây cảm ứng sang cặp dây kề; xoắn dây theo đúng chuẩn giúp hạn chế.","cat":2,"ready":true,"certified":false},{"id":294,"number":293,"en":"what is the purpose of configuring a switch with a default gateway address?","vi":"Tại sao cần cấu hình default gateway cho switch trong mạng đang vận hành?","opts":{"A":"Hosts that are connected to the switch can use the switch default gateway address to forward packets to a remote destination.","B":"A switch must have a default gateway to be accessible by Telnet and SSH.","C":"The default gateway address is used to forward packets originating from the switch to remote networks.","D":"It provides a next-hop address for all traffic that flows through the switch. eC"},"ans":"C","why":"Default gateway cho phép switch Layer 2 được quản trị từ subnet khác thông qua SVI, còn chức năng chuyển frame trong VLAN vẫn dựa trên MAC.","cat":2,"ready":true,"certified":true},{"id":295,"number":294,"en":"What is the purpose of the no shutdown command on a switch interface?","vi":"Lệnh `no shutdown` trên giao diện switch có tác dụng gì?","opts":{"A":"It brings the interface out of administratively down state.","B":"It sets the interface to dynamic mode.","C":"It disables the interface permanently.","D":"It resets the configuration to default."},"ans":"A","why":"`no shutdown` bỏ trạng thái administratively down và cho phép interface hoạt động nếu cáp, thiết bị đối diện và cấu hình lớp liên kết đều đúng.","cat":0,"ready":true,"certified":false}];
const QUIZ_READY=Q.filter(q=>q.ready).length;
const SETS=Array.from({length:Math.ceil(Q.length/5)},(_,i)=>Q.slice(i*5,i*5+5));
const TYPE_GROUPS=CATS.map((_,c)=>{let v=Q.filter(q=>q.cat===c);return Array.from({length:Math.ceil(v.length/5)},(_,i)=>v.slice(i*5,i*5+5))});
const app=document.getElementById('app');const esc=v=>String(v??'').replace(/[&<>"']/g,ch=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[ch]));
const shuffle=a=>{a=[...a];for(let i=a.length-1;i>0;i--){let j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]];}return a};
const qmap=new Map(Q.map(q=>[q.id,q]));const key='NWC-text-v2';let store={};try{store=JSON.parse(localStorage.getItem(key)||'{}')}catch(_e){};
if(!Object.keys(store).length){try{let prev=JSON.parse(localStorage.getItem('NWC-learning-v1')||'{}');store={doneSets:prev.doneSets||{},doneType:prev.doneType||{},doneReviews:prev.doneReviews||{},selSets:prev.selSets||[],selTypes:prev.selType||[]}}catch(_e){}}
const S={mode:'sets',set:0,cat:0,group:0,phase:'learn',custom:false,selSets:new Set(store.selSets||[]),selTypes:new Set(store.selTypes||[]),doneSets:store.doneSets||{},doneTypes:store.doneType||{},doneReviews:store.doneReviews||{},test:[],src:'set',answers:{},page:0,why:new Set()};
function persist(){try{localStorage.setItem(key,JSON.stringify({selSets:[...S.selSets],selTypes:[...S.selTypes],doneSets:S.doneSets,doneType:S.doneTypes,doneReviews:S.doneReviews}))}catch(_e){}}
function groupRows(){return S.mode==='sets'?SETS[S.set]:TYPE_GROUPS[S.cat][S.group]}
function currentTitle(){return S.mode==='sets'?`Bộ ${S.set+1}/${SETS.length}`:`${CATS[S.cat]} · Nhóm ${S.group+1}/${TYPE_GROUPS[S.cat].length}`}
function readyCount(rows){return rows.filter(q=>q.ready).length}
function header(){const test=S.phase==='quiz';const p=S.mode==='sets'?(S.set+1)/SETS.length:(S.group+1)/(TYPE_GROUPS[S.cat]||[]).length;let answered=Object.keys(S.answers).filter(id=>(S.answers[id]||[]).length>0).length;return `<header><div class="navrow"><div><h1>${test?'NWC · English Test':'NWC · Học song ngữ và kiểm tra'}</h1><div class="muted">${test?`Randomized questions and options · English only · ${answered}/${S.test.length} answered`:'294 câu được viết lại bằng văn bản · ${QUIZ_READY} câu có thể kiểm tra · Bản dịch và giải thích tiếng Việt'}</div></div>${test?'':`<div class="small">${esc(currentTitle())}</div>`}</div><div class="progress"><b style="width:${test?100*answered/Math.max(1,S.test.length):100*p}%"></b></div></header>`}
function tabs(){return `<div class="tabs"><button data-act="mode" data-mode="sets" class="${S.mode==='sets'?'active':''}">Học theo bộ</button><button data-act="mode" data-mode="types" class="${S.mode==='types'?'active':''}">Phân loại câu hỏi</button></div>`}
function setsPanel(){return `<div class="panel"><div class="panelhead"><div><h2>Chọn bộ học tự do</h2><div class="muted">Tất cả ${SETS.length} bộ đều mở. Học và kiểm tra sau mỗi bộ.</div></div><button data-act="toggleCustom">${S.custom?'Đóng chọn đề':'Kiểm tra tùy chọn nhiều bộ'}</button></div>${S.custom?customSets():`<div class="grid">${SETS.map((g,i)=>`<button data-act="set" data-i="${i}" class="${S.set===i?'active':''} ${S.doneSets[i]?'done':''}">Bộ ${i+1}<span class="tiny">${readyCount(g)}/${g.length} câu</span></button>`).join('')}</div>`}</div>`}
function typesPanel(){return `<div class="panel"><div class="panelhead"><div><h2>Phân loại câu hỏi</h2><div class="muted">Chọn bất kỳ dạng và nhóm nào, không cần học theo thứ tự.</div></div><button data-act="toggleCustom">${S.custom?'Đóng chọn đề':'Kiểm tra tùy chọn nhiều nhóm'}</button></div>${S.custom?customTypes():`<div class="types">${CATS.map((c,i)=>`<button data-act="cat" data-i="${i}" class="${S.cat===i?'active':''}">${esc(c)}<small>${TYPE_GROUPS[i].flat().length} câu · ${TYPE_GROUPS[i].length} nhóm</small></button>`).join('')}</div><div class="small">Chọn nhóm trong ${esc(CATS[S.cat])}</div><div class="grid">${TYPE_GROUPS[S.cat].map((g,i)=>`<button data-act="group" data-i="${i}" class="${S.group===i?'active':''} ${S.doneTypes[S.cat+':'+i]?'done':''}">Nhóm ${i+1}<span class="tiny">${readyCount(g)}/${g.length} câu</span></button>`).join('')}</div>`}</div>`}
function customSets(){let chosen=[...S.selSets].sort((a,b)=>a-b).flatMap(i=>SETS[i]||[]);return `<div class="selectgroup"><div class="navrow"><b>Chọn các bộ để kiểm tra chung</b><span class="stat">${readyCount(chosen)} câu</span></div><div class="actions"><button data-act="allSets">Chọn tất cả</button><button data-act="clearSets">Bỏ chọn</button></div><div class="grid">${SETS.map((g,i)=>`<label class="selectline"><input type="checkbox" data-check-set="${i}" ${S.selSets.has(i)?'checked':''}><span>Bộ ${i+1}<small class="tiny">${readyCount(g)} câu</small></span></label>`).join('')}</div><div class="actions"><button class="primary" data-act="customTest" data-from="sets" ${readyCount(chosen)?'':'disabled'}>Kiểm tra ${readyCount(chosen)} câu →</button></div></div>`}
function customTypes(){let selected=[...S.selTypes].flatMap(k=>{let [a,b]=k.split(':').map(Number);return TYPE_GROUPS[a]?.[b]||[]});return `<div class="selectgroup"><div class="navrow"><b>Chọn nhóm từ một hoặc nhiều dạng</b><span class="stat">${readyCount(selected)} câu</span></div><div class="actions"><button data-act="allTypes">Chọn tất cả</button><button data-act="clearTypes">Bỏ chọn</button></div>${TYPE_GROUPS.map((gg,c)=>`<div class="selectgroup"><b>${esc(CATS[c])}</b><div class="grid">${gg.map((g,i)=>`<label class="selectline"><input type="checkbox" data-check-type="${c}:${i}" ${S.selTypes.has(c+':'+i)?'checked':''}>Nhóm ${i+1}<span class="tiny">${readyCount(g)} câu</span></label>`).join('')}</div></div>`).join('')}<div class="actions"><button class="primary" data-act="customTest" data-from="types" ${readyCount(selected)?'':'disabled'}>Kiểm tra ${readyCount(selected)} câu →</button></div></div>`}
function figure(q,english=false){return q.figure?`<details><summary>${english?'View original network diagram':'Xem sơ đồ mạng nguồn (khi cần)'}</summary><img src="${q.figure}" loading="lazy" alt="${english?'Network diagram':'Sơ đồ mạng'}"></details>`:''}
function explanation(q){let open=S.why.has(q.id);return `<div class="why"><button data-act="why" data-id="${q.id}">${open?'Ẩn giải thích':'Vì sao chọn đáp án này?'}</button>${open?`<div class="whytext">${esc(q.why)}</div>`:''}</div>`}
function studyCard(q,i){let opts=Object.entries(q.opts);let correct=opts.filter(([k])=>q.ans.includes(k)).map(([k,v])=>`${k}. ${v}`).join(' · ');return `<article class="qcard"><div class="small">CÂU ${q.number} · ${esc(CATS[q.cat])}</div><div class="qen">${esc(q.en)}</div><div class="qvi"><b>Dịch nghĩa:</b> ${esc(q.vi)}</div>${figure(q)}<div class="opts">${opts.map(([k,v])=>`<div class="opt"><b>${k}.</b>${esc(v)}</div>`).join('')}</div><div class="answer"><b>${q.ready?'✓ Đáp án: ':'Đáp án nguồn (chưa xác minh): '}${esc(q.ans.split('').join(', '))}</b>${correct?`<div>${esc(correct)}</div>`:''}${explanation(q)}</div>${!q.ready?'<div class="warning">Câu này chưa được đưa vào chấm tự động vì đáp án/điều kiện trong nguồn chưa đủ chắc chắn. Nội dung và lời giải vẫn có thể dùng để ôn tập.</div>':''}</article>`}
function learn(){let rows=groupRows(),n=readyCount(rows);return tabs()+(S.mode==='sets'?setsPanel():typesPanel())+`<span class="badge">PHẦN HỌC · ${esc(currentTitle())} · ${rows.length} câu</span>${rows.map(studyCard).join('')}<div class="actions"><button class="primary" data-act="start" ${n?'':'disabled'}>Kiểm tra ${n} câu bằng tiếng Anh →</button></div>`}
function startTest(rows,src){let eligible=rows.filter(q=>q.ready);if(!eligible.length)return;S.test=shuffle(eligible).map(q=>({id:q.id,order:shuffle(Object.keys(q.opts))}));S.answers={};S.phase='quiz';S.src=src;S.page=0;S.why.clear();render(true)}
function testOption(q,o,j){const orig=o.order[j];const selected=(S.answers[q.id]||[]).includes(orig);return `<button type="button" class="pick ${selected?'selected':''}" data-act="choose" data-id="${q.id}" data-choice="${orig}" aria-pressed="${selected}"><span class="letter">${'ABCDEF'[j]}</span><span>${esc(q.opts[orig])}</span></button>`}
function test(){let len=S.test.length,from=S.page*10,to=Math.min(len,from+10),n=S.test.filter(o=>(S.answers[o.id]||[]).length).length;return `<div class="panel"><b>ENGLISH TEST</b><div class="muted">${len} questions · ${n} answered. Questions and answer choices are shuffled. Select ${len?'the correct option(s)':''} and submit.</div></div>${S.test.slice(from,to).map((o,j)=>{let q=qmap.get(o.id);return `<article class="qcard"><div class="small">QUESTION ${from+j+1} OF ${len} · ${q.ans.length>1?'SELECT '+q.ans.length:'SELECT ONE'}</div><div class="qen">${esc(q.en)}</div>${figure(q,true)}<div class="opts">${o.order.map((_,k)=>testOption(q,o,k)).join('')}</div></article>`}).join('')}${pager(len)}<div class="actions"><button data-act="exit">Exit test</button><button class="primary" data-act="submit" ${n===len?'':'disabled'}>Submit answers (${n}/${len})</button></div>`}
function score(){return S.test.filter(o=>{let q=qmap.get(o.id);return (S.answers[q.id]||[]).slice().sort().join('')===q.ans}).length}
function pager(len){return len>10?`<div class="pager"><button data-act="prevPage" ${S.page===0?'disabled':''}>← Previous</button><b>${S.page+1}/${Math.ceil(len/10)}</b><button data-act="nextPage" ${S.page>=Math.ceil(len/10)-1?'disabled':''}>Next →</button></div>`:''}
function results(){let points=score(),len=S.test.length,from=S.page*10,to=Math.min(len,from+10);return `<div class="summary"><div class="small">KẾT QUẢ KIỂM TRA</div><div class="score">${points}/${len}</div><b>${Math.round(points/len*100)}/100 điểm</b><div class="muted">Có thể mở lời giải của từng câu bên dưới.</div></div>${S.test.slice(from,to).map((o,j)=>{let q=qmap.get(o.id),chosen=(S.answers[q.id]||[]).slice().sort(),yes=chosen.join('')===q.ans;let originalToDisplay=k=>'ABCDEF'[o.order.indexOf(k)];return `<article class="qcard"><div class="small">CÂU ${from+j+1} · <span class="${yes?'ok':'bad'}">${yes?'ĐÚNG':'SAI'}</span> · CÂU GỐC ${q.number}</div><div class="qen">${esc(q.en)}</div><div class="qvi"><b>Dịch nghĩa:</b> ${esc(q.vi)}</div>${figure(q)}<div class="result ${yes?'ok':'bad'}">Bạn chọn: <b>${chosen.length?chosen.map(k=>originalToDisplay(k)+'. '+q.opts[k]).join(' · '):'—'}</b></div><div class="result ok">Đúng: <b>${q.ans.split('').map(k=>originalToDisplay(k)+'. '+q.opts[k]).join(' · ')}</b></div>${explanation(q)}</article>`}).join('')}${pager(len)}<div class="actions"><button data-act="retry">Làm lại đề</button><button data-act="back">Quay lại chọn bộ/nhóm</button><button class="primary" data-act="next">${S.src.startsWith('custom')?'Hoàn thành':'Tiếp tục học →'}</button></div>`}
function offer(){return `<div class="summary"><span class="badge">ÔN 15 CÂU</span><h2>Bạn muốn kiểm tra lại 15 câu vừa học không?</h2><p class="muted">Câu hỏi và đáp án được đảo thứ tự, chỉ sử dụng tiếng Anh trong lúc làm bài.</p><div class="actions" style="justify-content:center"><button data-act="skipReview">Bỏ qua</button><button class="primary" data-act="review">Có, ôn 15 câu</button></div></div>`}
function finished(){return `<div class="summary"><h2>Đã đến nhóm cuối</h2><p class="muted">Bạn có thể chọn bất kỳ bộ hoặc dạng nào khác để tiếp tục ôn tập.</p><button data-act="back" class="primary">Quay về chọn bộ/nhóm</button></div>`}
function render(top=false){app.innerHTML=header()+({learn,quiz:test,result:results,offer,finished}[S.phase]||learn)()+`<footer class="footer">${S.phase==='quiz'?'NWC question bank · Answers remain hidden until submission.':'NWC(1).zip · 294 câu viết lại bằng văn bản, dịch và giải thích riêng. Hai câu (bảng định tuyến và IPv6 DAD) chưa chấm tự động. Một số khóa đáp án từ ảnh nguồn vẫn cần tiếp tục xác minh.'}</footer>`;if(top)window.scrollTo({top:0,behavior:'instant'})}
function advance(){if(S.mode==='sets'){if(S.set<SETS.length-1){S.set++;S.phase='learn'}else S.phase='finished'}else{if(S.group<TYPE_GROUPS[S.cat].length-1){S.group++;S.phase='learn'}else S.phase='finished'}S.why.clear();render(true)}
function next(){if(S.src.startsWith('custom')){S.phase='learn';S.custom=true;render(true);return}if(S.src==='review'){S.doneReviews[S.set]=1;persist();advance();return}if(S.src==='set'&&(S.set+1)%3===0&&S.set>=2&&!S.doneReviews[S.set]){S.phase='offer';render(true);return}advance()}
app.addEventListener('click',ev=>{let b=ev.target.closest('[data-act]');if(!b)return;let a=b.dataset.act;
if(a==='mode'){S.mode=b.dataset.mode;S.phase='learn';S.custom=false;S.why.clear();render(true)}
else if(a==='cat'){S.cat=+b.dataset.i;S.group=0;S.phase='learn';S.why.clear();render(true)}
else if(a==='group'){S.group=+b.dataset.i;S.phase='learn';S.why.clear();render(true)}
else if(a==='set'){S.set=+b.dataset.i;S.phase='learn';S.why.clear();render(true)}
else if(a==='toggleCustom'){S.custom=!S.custom;render()}
else if(a==='allSets'){SETS.forEach((_,i)=>S.selSets.add(i));persist();render()}
else if(a==='clearSets'){S.selSets.clear();persist();render()}
else if(a==='allTypes'){TYPE_GROUPS.forEach((arr,c)=>arr.forEach((_,g)=>S.selTypes.add(c+':'+g)));persist();render()}
else if(a==='clearTypes'){S.selTypes.clear();persist();render()}
else if(a==='customTest'){let rows=b.dataset.from==='sets'?[...S.selSets].sort((a,b)=>a-b).flatMap(i=>SETS[i]||[]):[...S.selTypes].flatMap(k=>{let [c,g]=k.split(':').map(Number);return TYPE_GROUPS[c]?.[g]||[]});rows=[...new Map(rows.map(q=>[q.id,q])).values()];startTest(rows,'custom'+b.dataset.from)}
else if(a==='start')startTest(groupRows(),S.mode==='sets'?'set':'type');
else if(a==='choose'){let id=+b.dataset.id,k=b.dataset.choice,q=qmap.get(id),selected=S.answers[id]||[];S.answers[id]=q.ans.length===1?[k]:(selected.includes(k)?selected.filter(x=>x!==k):[...selected,k]);let y=window.scrollY;render();window.scrollTo({top:y,behavior:'instant'})}
else if(a==='why'){let id=+b.dataset.id;if(S.why.has(id))S.why.delete(id);else S.why.add(id);let y=window.scrollY;render();window.scrollTo({top:y,behavior:'instant'})}
else if(a==='submit'){if(S.test.some(o=>!(S.answers[o.id]||[]).length))return;S.phase='result';S.page=0;let earned=score(),total=S.test.length;if(S.src==='set')S.doneSets[S.set]={earned,total};if(S.src==='type')S.doneTypes[S.cat+':'+S.group]={earned,total};persist();render(true)}
else if(a==='nextPage'){S.page=Math.min(Math.ceil(S.test.length/10)-1,S.page+1);render(true)}
else if(a==='prevPage'){S.page=Math.max(0,S.page-1);render(true)}
else if(a==='retry')startTest(S.test.map(o=>qmap.get(o.id)),S.src);
else if(a==='next')next();
else if(a==='review'){S.doneReviews[S.set]=1;persist();startTest(SETS.slice(S.set-2,S.set+1).flat(),'review')}
else if(a==='skipReview'){S.doneReviews[S.set]=1;persist();advance()}
else if(a==='exit'||a==='back'){S.phase='learn';S.why.clear();render(true)}
});
app.addEventListener('change',ev=>{let e=ev.target;if(e.matches('[data-check-set]')){let i=+e.dataset.checkSet;e.checked?S.selSets.add(i):S.selSets.delete(i);persist();render()}else if(e.matches('[data-check-type]')){let k=e.dataset.checkType;e.checked?S.selTypes.add(k):S.selTypes.delete(k);persist();render()}});
render();
</script></body></html>
